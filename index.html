
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Персональный организатор: задачи, погода и планирование дня">
  <title>Персональный организатор</title>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <header class="header">
    <h1>Персональный организатор</h1>
    <p>Твоё пространство для планирования дня</p>
  </header>

  <main class="container">
    <section class="toolbar" aria-label="Управление виджетами">
      <h2>Мой день</h2>
      <div class="toolbar__buttons">
        <button id="add-todo">Добавить список дел</button>
        <button id="add-quote">Добавить цитату</button>
        <button id="add-weather">Добавить погоду</button>
        <button id="add-date">Добавить дату</button>
      </div>
    </section>

    <section
      id="dashboard"
      class="dashboard"
      aria-label="Панель виджетов"
      aria-live="polite"
    >
    </section>
  </main>

  <footer class="footer">
    <p>Персональный организатор · 2026</p>
  </footer>

  <script type="module" src="main.js"></script>
</body>
</html>
